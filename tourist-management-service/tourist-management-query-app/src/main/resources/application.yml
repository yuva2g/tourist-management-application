spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: testDB
  application:
    name: tourist-management-query-app
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_ON_EXIT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  # Hibernate settings
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic-name: tourist-companies

logging:
  level:
    root: INFO
    com.cognizant.fse.assignment: DEBUG

server:
  port: 8083
